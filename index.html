<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Modern Todo App</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <i data-lucide="check-circle-2"></i>
        </div>
        <div>
          <h1>TaskFlow</h1>
          <p class="subtitle" id="currentDateText">Stay organized and productive</p>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggleBtn" title="Toggle Theme" aria-label="Toggle theme">
        <i data-lucide="moon" class="moon-icon"></i>
        <i data-lucide="sun" class="sun-icon"></i>
      </button>
    </header>

    <!-- Stats & Progress Card -->
    <section class="stats-card">
      <div class="stats-header">
        <div>
          <span class="stats-label">Progress</span>
          <h2 class="stats-title" id="progressSummary">0 of 0 completed</h2>
        </div>
        <div class="percentage-badge" id="progressPercent">0%</div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%"></div>
      </div>
      <div class="quick-stats">
        <div class="stat-pill"><i data-lucide="list-todo"></i> <span id="totalTasksCount">0</span> Total</div>
        <div class="stat-pill"><i data-lucide="clock"></i> <span id="pendingTasksCount">0</span> Active</div>
        <div class="stat-pill"><i data-lucide="check-check"></i> <span id="completedTasksCount">0</span> Done</div>
      </div>
    </section>

    <!-- Add Task Form -->
    <section class="task-form-card">
      <form id="addTaskForm">
        <div class="input-row">
          <input 
            type="text" 
            id="taskInput" 
            placeholder="What needs to be done?..." 
            autocomplete="off" 
            required 
          />
          <button type="submit" class="btn btn-primary" id="addTaskBtn">
            <i data-lucide="plus"></i>
            <span>Add Task</span>
          </button>
        </div>

        <!-- Task Metadata Row (Priority, Due Date, Category) -->
        <div class="meta-row">
          <div class="meta-item">
            <label for="prioritySelect"><i data-lucide="flag"></i> Priority</label>
            <select id="prioritySelect">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>

          <div class="meta-item">
            <label for="categorySelect"><i data-lucide="tag"></i> Category</label>
            <select id="categorySelect">
              <option value="General" selected>General</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Study">Study</option>
              <option value="Shopping">Shopping</option>
            </select>
          </div>

          <div class="meta-item">
            <label for="dueDateInput"><i data-lucide="calendar"></i> Due Date</label>
            <input type="date" id="dueDateInput" />
          </div>
        </div>
      </form>
    </section>

    <!-- Filters & Search Bar -->
    <section class="filter-search-section">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="Search tasks by title or tag..." />
        <button id="clearSearchBtn" class="clear-search-btn" title="Clear Search" style="display: none;">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="controls-row">
        <!-- Status Filter Tabs -->
        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">All</button>
          <button class="tab-btn" data-filter="active">Active</button>
          <button class="tab-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Category Dropdown Filter & Clear Completed -->
        <div class="filter-actions">
          <select id="categoryFilter" class="secondary-select" title="Filter by Category">
            <option value="all">All Categories</option>
            <option value="General">General</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Study">Study</option>
            <option value="Shopping">Shopping</option>
          </select>
          <button id="clearCompletedBtn" class="btn btn-ghost btn-sm" title="Clear Completed Tasks">
            <i data-lucide="trash-2"></i> Clear Completed
          </button>
        </div>
      </div>
    </section>

    <!-- Task List Container -->
    <main class="tasks-container">
      <ul class="task-list" id="taskList" aria-live="polite">
        <!-- Dynamic Tasks injected via JavaScript -->
      </ul>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon-wrap">
          <i data-lucide="clipboard-list"></i>
        </div>
        <h3 id="emptyStateTitle">No tasks found</h3>
        <p id="emptyStateDesc">Add a new task above to get started!</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Organize effortlessly • All data saved locally in your browser</p>
    </footer>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal-overlay" id="editModal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h3 id="modalTitle"><i data-lucide="edit-3"></i> Edit Task</h3>
        <button class="modal-close-btn" id="closeModalBtn" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="editTaskForm">
        <input type="hidden" id="editTaskId" />
        <div class="form-group">
          <label for="editTaskTitle">Task Title</label>
          <input type="text" id="editTaskTitle" required autocomplete="off" />
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="editPrioritySelect"><i data-lucide="flag"></i> Priority</label>
            <select id="editPrioritySelect">
              <option value="low">🟢 Low</option>
              <option value="medium">🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editCategorySelect"><i data-lucide="tag"></i> Category</label>
            <select id="editCategorySelect">
              <option value="General">General</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Study">Study</option>
              <option value="Shopping">Shopping</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="editDueDateInput"><i data-lucide="calendar"></i> Due Date</label>
          <input type="date" id="editDueDateInput" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

  <!-- Application Logic -->
  <script src="js/app.js"></script>
</body>
</html>
